# Render.yaml configuration for Warehouse Management System
# Microservices Architecture Deployment with Docker
# Using Aiven MySQL Database

services:
  # API Gateway Service
  - type: web
    name: api-gateway-viet-bac
    env: docker
    plan: free
    dockerfilePath: ./backend/api-gateway-viet-bac/Dockerfile
    dockerContext: ./backend/api-gateway-viet-bac
    healthCheckPath: /actuator/health
    envVars:
      - key: SERVER_PORT
        value: 9000
      - key: SPRING_PROFILES_ACTIVE
        value: prod
      - key: JAVA_OPTS
        value: -Xmx512m -Xms256m -XX:+UseContainerSupport

  # Employee Service
  - type: web
    name: employee-service
    env: docker
    plan: free
    dockerfilePath: ./backend/employee-service/Dockerfile
    dockerContext: ./backend/employee-service
    healthCheckPath: /actuator/health
    envVars:
      - key: SERVER_PORT
        value: 8083
      - key: SPRING_PROFILES_ACTIVE
        value: prod
      - key: DATASOURCE_URL
        value: jdbc:mysql://viet-bac-warehouse-viet-bac-warehouse.d.aivencloud.com:13008/employee_service?useSSL=true&requireSSL=true&verifyServerCertificate=false
      - key: DATASOURCE_USERNAME
        value: avnadmin
      - key: DATASOURCE_PASSWORD
        sync: false # Set in Render Dashboard: AVNS_SuregEwOhBIGLmrn4xC
      - key: KEYCLOAK_SERVER_URL
        value: http://localhost:8180
      - key: KEYCLOAK_REALM
        value: viet-bac-warehouse
      - key: KEYCLOAK_CLIENT_ID
        value: admin-cli
      - key: KEYCLOAK_USERNAME
        sync: false
      - key: KEYCLOAK_PASSWORD
        sync: false
      - key: JAVA_OPTS
        value: -Xmx512m -Xms256m -XX:+UseContainerSupport

