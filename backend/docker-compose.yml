services:

  # ==================== Keycloak Auth Service ====================
  keycloak-mysql:
    image: mysql:8.0.36
    container_name: keycloak-mysql
    environment:
      MYSQL_ROOT_PASSWORD: ${KEYCLOAK_MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${KEYCLOAK_MYSQL_DATABASE}
      MYSQL_USER: ${KEYCLOAK_MYSQL_USER}
      MYSQL_PASSWORD: ${KEYCLOAK_MYSQL_PASSWORD}
    ports:
      - "3350:3306"
    volumes:
      - keycloak_mysql_data:/var/lib/mysql
    networks:
      - micro-net
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      timeout: 20s
      retries: 10

  keycloak:
    image: quay.io/keycloak/keycloak:23.0.3
    container_name: keycloak
    command: ["start-dev", "--import-realm"]
    environment:
      KEYCLOAK_ADMIN: ${KEYCLOAK_ADMIN}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD}
      KC_DB: mysql
      KC_DB_URL: jdbc:mysql://keycloak-mysql:3306/${KEYCLOAK_MYSQL_DATABASE}
      KC_DB_USERNAME: ${KEYCLOAK_MYSQL_ROOT_USER}
      KC_DB_PASSWORD: ${KEYCLOAK_MYSQL_ROOT_PASSWORD}
      KC_HOSTNAME: localhost
      KC_HOSTNAME_STRICT: false
      KC_HTTP_ENABLED: true
      KC_HEALTH_ENABLED: true
    ports:
      - "8180:8080"
    depends_on:
      keycloak-mysql:
        condition: service_healthy
    networks:
      - micro-net

  # ==================== Redis Cache ====================
  redis:
    image: redis:7-alpine
    container_name: redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - micro-net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      timeout: 3s
      retries: 5

  # ==================== MinIO Object Storage ====================
  minio:
    image: minio/minio:latest
    container_name: minio
    ports:
      - "8901:8901"   # API
      - "8900:8900"   # Console UI
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-admin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-admin12345}
    volumes:
      - minio_data:/data
    command: server /data --address ":8901" --console-address ":8900"
    networks:
      - micro-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8901/minio/health/live"]
      interval: 30s
      timeout: 5s
      retries: 5

  # ==================== LibreOffice Doc Converter ====================
  doc-converter:
    build:
      context: ./transaction-service
      dockerfile: Dockerfile.libreoffice
    container_name: doc-converter
    volumes:
      - transaction_tmp:/tmp
    tty: true
    networks:
      - micro-net

  # ==================== Employee Service ====================
  employee-mysql:
    image: mysql:8.0.36
    container_name: employee-mysql
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${EMPLOYEE_MYSQL_DATABASE}
    ports:
      - "3343:3306"
    volumes:
      - employee_mysql_data:/var/lib/mysql
    networks:
      - micro-net
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      timeout: 20s
      retries: 10

  employee-service:
    build:
      context: .
      dockerfile: employee-service/Dockerfile
    container_name: employee-service
    ports:
      - "8083:8083"
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://employee-mysql:3306/${EMPLOYEE_MYSQL_DATABASE}
      SPRING_DATASOURCE_USERNAME: ${MYSQL_ROOT_USER}
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      KEYCLOAK_SERVER_URL: http://keycloak:8080
    depends_on:
      employee-mysql:
        condition: service_healthy
      keycloak:
        condition: service_started
    networks:
      - micro-net

  # ==================== Inventory Optimization Service ====================
  inventory-optimization-mysql:
    image: mysql:8.0.36
    container_name: inventory-optimization-mysql
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${INVENTORY_OPTIMIZATION_MYSQL_DATABASE}
    ports:
      - "3351:3306"
    volumes:
      - inventory_optimization_mysql_data:/var/lib/mysql
    networks:
      - micro-net
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      timeout: 20s
      retries: 10

  inventory-optimization-service:
    build:
      context: .
      dockerfile: inventory-optimization-service/Dockerfile
    container_name: inventory-optimization-service
    ports:
      - "8091:8091"
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://inventory-optimization-mysql:3306/${INVENTORY_OPTIMIZATION_MYSQL_DATABASE}
      SPRING_DATASOURCE_USERNAME: ${MYSQL_ROOT_USER}
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
      PRODUCT_SERVICE_URL: http://product-service:8084/api
      EMPLOYEE_SERVICE_URL: http://employee-service:8083/api
      WAREHOUSE_SERVICE_URL: http://warehouse-service:8082/api
      SUPPLIER_SERVICE_URL: http://supplier-service:8086/api
      TRANSACTION_SERVICE_URL: http://transaction-service:8085/api
    depends_on:
      inventory-optimization-mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - micro-net

  # ==================== Product Service ====================
  product-mysql:
    image: mysql:8.0.36
    container_name: product-mysql
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${PRODUCT_MYSQL_DATABASE}
    ports:
      - "3344:3306"
    volumes:
      - product_mysql_data:/var/lib/mysql
    networks:
      - micro-net
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      timeout: 20s
      retries: 10

  product-service:
    build:
      context: .
      dockerfile: product-service/Dockerfile
    container_name: product-service
    ports:
      - "8084:8084"
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://product-mysql:3306/${PRODUCT_MYSQL_DATABASE}
      SPRING_DATASOURCE_USERNAME: ${MYSQL_ROOT_USER}
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MINIO_ENDPOINT: http://minio:8901
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER:-admin}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-admin12345}
    depends_on:
      product-mysql:
        condition: service_healthy
      minio:
        condition: service_healthy
    networks:
      - micro-net

  # ==================== Supplier Service ====================
  supplier-mysql:
    image: mysql:8.0.36
    container_name: supplier-mysql
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${SUPPLIER_MYSQL_DATABASE:-supplier_db}
    ports:
      - "3347:3306"
    volumes:
      - supplier_mysql_data:/var/lib/mysql
    networks:
      - micro-net
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      timeout: 20s
      retries: 10

  supplier-service:
    build:
      context: .
      dockerfile: supplier-service/Dockerfile
    container_name: supplier-service
    ports:
      - "8086:8086"
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://supplier-mysql:3306/${SUPPLIER_MYSQL_DATABASE:-supplier_db}
      SPRING_DATASOURCE_USERNAME: ${MYSQL_ROOT_USER}
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_ROOT_PASSWORD}
    depends_on:
      supplier-mysql:
        condition: service_healthy
    networks:
      - micro-net

  # ==================== Transaction Service ====================
  transaction-mysql:
    image: mysql:8.0.36
    container_name: transaction-mysql
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${TRANSACTION_MYSQL_DATABASE}
    ports:
      - "3345:3306"
    volumes:
      - transaction_mysql_data:/var/lib/mysql
    networks:
      - micro-net
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      timeout: 20s
      retries: 10

  transaction-service:
    build:
      context: .
      dockerfile: transaction-service/Dockerfile
    container_name: transaction-service
    ports:
      - "8085:8085"
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://transaction-mysql:3306/${TRANSACTION_MYSQL_DATABASE}
      SPRING_DATASOURCE_USERNAME: ${MYSQL_ROOT_USER}
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      DOC_CONVERTER_HOST: doc-converter
    depends_on:
      transaction-mysql:
        condition: service_healthy
      doc-converter:
        condition: service_started
    networks:
      - micro-net
    volumes:
      - transaction_tmp:/tmp

  # ==================== Warehouse Service ====================
  warehouse-mysql:
    image: mysql:8.0.36
    container_name: warehouse-mysql
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${WAREHOUSE_MYSQL_DATABASE}
    ports:
      - "3342:3306"
    volumes:
      - warehouse_mysql_data:/var/lib/mysql
    networks:
      - micro-net
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      timeout: 20s
      retries: 10

  warehouse-service:
    build:
      context: .
      dockerfile: warehouse-service/Dockerfile
    container_name: warehouse-service
    ports:
      - "8082:8082"
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://warehouse-mysql:3306/${WAREHOUSE_MYSQL_DATABASE}
      SPRING_DATASOURCE_USERNAME: ${MYSQL_ROOT_USER}
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_ROOT_PASSWORD}
    depends_on:
      warehouse-mysql:
        condition: service_healthy
    networks:
      - micro-net

  # ==================== API Gateway ====================
  api-gateway:
    build:
      context: .
      dockerfile: api-gateway-viet-bac/Dockerfile
    container_name: api-gateway
    ports:
      - "9000:9000"
    environment:
      KEYCLOAK_SERVER_URL: http://keycloak:8080
      EMPLOYEE_SERVICE_URL: http://employee-service:8083
      PRODUCT_SERVICE_URL: http://product-service:8084
      TRANSACTION_SERVICE_URL: http://transaction-service:8085
      SUPPLIER_SERVICE_URL: http://supplier-service:8086
      WAREHOUSE_SERVICE_URL: http://warehouse-service:8082
      INVENTORY_OPTIMIZATION_SERVICE_URL: http://inventory-optimization-service:8091
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:5173}
    depends_on:
      - keycloak
      - employee-service
      - product-service
      - transaction-service
      - supplier-service
      - warehouse-service
      - inventory-optimization-service
    networks:
      - micro-net

volumes:
  keycloak_mysql_data:
  redis_data:
  minio_data:
  employee_mysql_data:
  inventory_optimization_mysql_data:
  product_mysql_data:
  supplier_mysql_data:
  transaction_mysql_data:
  transaction_tmp:
  warehouse_mysql_data:

networks:
  micro-net:
    driver: bridge