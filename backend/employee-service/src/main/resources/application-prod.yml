# application-prod.yml
# Đặt file này vào thư mục src/main/resources của mỗi service

spring:
  application:
    name: ${SERVICE_NAME} # employee_service, product_service, etc.

  datasource:
    url: ${DATASOURCE_URL}
    username: ${DATASOURCE_USERNAME}
    password: ${DATASOURCE_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver

    # Aiven MySQL SSL Configuration
    hikari:
      maximum-pool-size: 5
      minimum-idle: 2
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000
      connection-test-query: SELECT 1

  jpa:
    hibernate:
      ddl-auto: validate # hoặc update cho development
    show-sql: false
    properties:
      hibernate:
        format_sql: false
        use_sql_comments: false

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

# Swagger/OpenAPI Configuration
springdoc:
  api-docs:
    path: /v3/api-docs
    enabled: true
  swagger-ui:
    path: /swagger/swagger-ui.html
    disable-swagger-default-url: true
    enabled: true

# Server Configuration
server:
  port: ${SERVER_PORT}
  compression:
    enabled: true
  error:
    include-message: always
    include-binding-errors: always

# Actuator Endpoints for Health Checks
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
      base-path: /actuator
  endpoint:
    health:
      show-details: when-authorized
  health:
    db:
      enabled: true

# Keycloak Configuration (nếu sử dụng)
keycloak:
  server-url: ${KEYCLOAK_SERVER_URL:http://localhost:8180}
  realm: ${KEYCLOAK_REALM:viet-bac-warehouse}
  client-id: ${KEYCLOAK_CLIENT_ID:admin-cli}
  username: ${KEYCLOAK_USERNAME}
  password: ${KEYCLOAK_PASSWORD}

# Logging Configuration
logging:
  level:
    root: INFO
    com.ecotel: INFO
    org.hibernate.SQL: WARN
    org.springframework.web: INFO
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} - %msg%n"
