spring:
  application:
    name: api-gateway-viet-bac
  main:
    web-application-type: reactive
  http:
    codec:
      max-in-memory-size: 20MB
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://localhost:8180/realms/optimization
          jwk-set-uri: http://localhost:8180/realms/optimization/protocol/openid-connect/certs
  cloud:
    gateway:
      server:
        webflux:
          routes:
            # Warehouse Service
            - id: warehouse-service
              uri: ${WAREHOUSE_SERVICE_URL}
              predicates:
                - Path=/api/warehouses/**,/api/inventories/**

            # Employee Service
            - id: employee-service
              uri: ${EMPLOYEE_SERVICE_URL}
              predicates:
                - Path=/api/employees/**

            # Product Service
            - id: product-service
              uri: ${PRODUCT_SERVICE_URL}
              predicates:
                - Path=/api/products/**,/api/product-categories/**, /api/product-images/**

            # Transaction Service
            - id: transaction-service
              uri: ${TRANSACTION_SERVICE_URL}
              predicates:
                - Path=/api/transactions/**, /api/files/**

            # Supplier Service
            - id: supplier-service
              uri: ${SUPPLIER_SERVICE_URL}
              predicates:
                - Path=/api/suppliers/**, /api/supplier-products/**

            # Employee Service
            - id: employee-service
              uri: ${EMPLOYEE_SERVICE_URL}
              predicates:
                - Path=/api/employees/**, /api/roles/**

            # Inventory Optimization Service (REST)
            - id: inventory-optimization-service
              uri: ${INVENTORY_OPTIMIZATION_SERVICE_URL}
              predicates:
                - Path=/api/inventory/**, /api/consumption-history/**,
                  /api/warehouse-config/**, /api/order-schedules/**,
                  /api/inventory-results/**, /api/inventory-parameters/**, 
                  /api/stock-counts/**, /api/analytics/**

            # Swagger UI routes
            - id: warehouse-service-docs
              uri: ${WAREHOUSE_SERVICE_URL}
              predicates:
                - Path=/warehouse-service/v3/api-docs
              filters:
                - RewritePath=/warehouse-service/(?<segment>.*), /$\{segment}
                - RemoveRequestHeader=Authorization

            - id: employee-service-docs
              uri: ${EMPLOYEE_SERVICE_URL}
              predicates:
                - Path=/employee-service/v3/api-docs
              filters:
                - RewritePath=/employee-service/(?<segment>.*), /$\{segment}
                - RemoveRequestHeader=Authorization

            - id: product-service-docs
              uri: ${PRODUCT_SERVICE_URL}
              predicates:
                - Path=/product-service/v3/api-docs
              filters:
                - RewritePath=/product-service/(?<segment>.*), /$\{segment}
                - RemoveRequestHeader=Authorization

            - id: transaction-service-docs
              uri: ${TRANSACTION_SERVICE_URL}
              predicates:
                - Path=/transaction-service/v3/api-docs
              filters:
                - RewritePath=/transaction-service/(?<segment>.*), /$\{segment}
                - RemoveRequestHeader=Authorization

            - id: inventory-optimization-service-docs
              uri: ${INVENTORY_OPTIMIZATION_SERVICE_URL}
              predicates:
                - Path=/inventory-optimization-service/v3/api-docs
              filters:
                - RewritePath=/inventory-optimization-service/(?<segment>.*), /$\{segment}
                - RemoveRequestHeader=Authorization

server:
  port: 9000
  shutdown: graceful # Doi cac request chay xong truoc khi tat server
  http2:
    enabled: true

reactor:
  netty:
    http:
      client:
        connect-timeout: 12000
        response-timeout: 120s
        pool:
          max-connections: 1000
          acquire-timeout: 10s

frontend:
  url: ${FRONTEND_URL}

springdoc:
  swagger-ui:
    path: /index.html
    urls:
      - name: employee-service
        url: /employee-service/v3/api-docs
      - name: supplier-service
        url: /supplier-service/v3/api-docs
      - name: warehouse-service
        url: /warehouse-service/v3/api-docs
      - name: product-service
        url: /product-service/v3/api-docs

management:
  endpoints:
    web:
      exposure:
        include: health

logging:
  level:
    org.springframework.cloud.gateway: TRACE
