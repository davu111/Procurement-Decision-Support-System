<!DOCTYPE html>
<html>
<head>
    <title>WebSocket Test</title>
    <script src="https://cdn.jsdelivr.net/npm/@stomp/stompjs@7.0.0/bundles/stomp.umd.min.js"></script>
    <style>
        body { font-family: Arial; padding: 20px; }
        .connected { color: green; font-weight: bold; }
        .disconnected { color: red; font-weight: bold; }
        .connecting { color: orange; font-weight: bold; }
        .message {
            border: 1px solid #ccc;
            padding: 10px;
            margin: 5px 0;
            border-radius: 5px;
        }
        .vehicle { background: #e3f2fd; }
        .alert { background: #ffebee; color: red; }
        .info { background: #f5f5f5; }
        .error { background: #ffcccc; }
        #debugLog {
            background: #f0f0f0;
            padding: 10px;
            margin-top: 20px;
            max-height: 300px;
            overflow-y: auto;
            font-family: monospace;
            font-size: 12px;
        }
    </style>
</head>
<body>
<h1>WebSocket Test Dashboard</h1>
<div>Status: <span id="status" class="disconnected">Disconnected</span></div>

<h2>Messages Log</h2>
<div id="messages"></div>

<h2>Debug Log</h2>
<div id="debugLog"></div>

<script>
    function debugLog(message) {
        const debugDiv = document.getElementById('debugLog');
        const timestamp = new Date().toLocaleTimeString();
        debugDiv.innerHTML += `[${timestamp}] ${message}<br>`;
        debugDiv.scrollTop = debugDiv.scrollHeight;
    }

    debugLog('Initializing WebSocket connection...');
    document.getElementById('status').textContent = 'Connecting...';
    document.getElementById('status').className = 'connecting';

    // Tạo STOMP client với WebSocket native
    const client = new StompJs.Client({
        brokerURL: 'ws://localhost:9000/ws',

        // Cấu hình reconnect
        reconnectDelay: 50000,

        // Cấu hình heartbeat
        heartbeatIncoming: 10000,
        heartbeatOutgoing: 10000,

        // Timeout cho connection
        connectionTimeout: 10000,

        // Debug chi tiết
        debug: function(str) {
            console.log('STOMP:', str);
            debugLog('STOMP: ' + str);
        },

        // Callback trước khi connect
        beforeConnect: function() {
            debugLog('beforeConnect: Attempting to connect...');
        },

        // Callback khi kết nối thành công
        onConnect: function(frame) {
            console.log('✅ Connected:', frame);
            debugLog('✅ Connected successfully!');

            document.getElementById('status').textContent = 'Connected';
            document.getElementById('status').className = 'connected';

            addMessage('System', 'WebSocket connected successfully!', 'info');

            // Subscribe to all topics
            try {
                debugLog('Subscribing to /topic/vehicles...');
                client.subscribe('/topic/vehicles', function(message) {
                    const data = JSON.parse(message.body);
                    addMessage('Vehicle', JSON.stringify(data, null, 2), 'vehicle');
                });

                debugLog('Subscribing to /topic/alerts...');
                client.subscribe('/topic/alerts', function(message) {
                    const data = JSON.parse(message.body);
                    addMessage('ALERT', JSON.stringify(data, null, 2), 'alert');
                });

                debugLog('Subscribing to /topic/events...');
                client.subscribe('/topic/events', function(message) {
                    const data = JSON.parse(message.body);
                    addMessage('Event', JSON.stringify(data, null, 2), 'info');
                });

                debugLog('✅ All subscriptions completed!');
                console.log('Subscribed to all topics!');
            } catch(e) {
                debugLog('❌ Subscription error: ' + e.message);
                addMessage('Error', 'Failed to subscribe: ' + e.message, 'error');
            }
        },

        // Callback khi có lỗi STOMP
        onStompError: function(frame) {
            console.error('❌ STOMP error:', frame);
            debugLog('❌ STOMP error: ' + frame.headers['message']);
            debugLog('Error body: ' + frame.body);

            document.getElementById('status').textContent = 'STOMP Error';
            document.getElementById('status').className = 'disconnected';

            addMessage('Error', 'STOMP Error: ' + frame.headers['message'] + '\n' + frame.body, 'error');
        },

        // Callback khi WebSocket bị đóng
        onWebSocketClose: function(event) {
            console.log('❌ WebSocket closed:', event);
            debugLog('❌ WebSocket closed. Code: ' + event.code + ', Reason: ' + event.reason);

            document.getElementById('status').textContent = 'Disconnected';
            document.getElementById('status').className = 'disconnected';

            addMessage('System', 'WebSocket closed. Code: ' + event.code, 'error');
        },

        // Callback khi WebSocket có lỗi
        onWebSocketError: function(event) {
            console.error('❌ WebSocket error:', event);
            debugLog('❌ WebSocket error occurred');

            document.getElementById('status').textContent = 'WebSocket Error';
            document.getElementById('status').className = 'disconnected';

            addMessage('Error', 'WebSocket error occurred', 'error');
        },

        // Callback khi đang reconnect
        onDisconnect: function() {
            debugLog('⚠️ Disconnected, will attempt to reconnect...');
        },

        // WebSocket factory để thêm event listeners
        webSocketFactory: function () {
            debugLog('Creating WebSocket to: ws://localhost:9000/ws');
            const ws = new WebSocket('ws://localhost:9000/ws');

            ws.addEventListener('open', function(event) {
                debugLog('✅ WebSocket opened!');
            });

            ws.addEventListener('error', function(event) {
                debugLog('❌ WebSocket raw error');
            });

            ws.addEventListener('close', function(event) {
                debugLog('WebSocket close event - Code: ' + event.code + ', Clean: ' + event.wasClean);
            });

            return ws;
        }
    });

    // Kích hoạt kết nối
    debugLog('Calling client.activate()...');
    client.activate();

    function addMessage(type, content, cssClass) {
        const messagesDiv = document.getElementById('messages');
        const messageDiv = document.createElement('div');
        messageDiv.className = 'message ' + cssClass;

        const timestamp = new Date().toLocaleTimeString();
        messageDiv.innerHTML = `
            <strong>[${timestamp}] ${type}</strong><br>
            <pre>${content}</pre>
        `;

        messagesDiv.insertBefore(messageDiv, messagesDiv.firstChild);
    }
</script>
</body>
</html>
