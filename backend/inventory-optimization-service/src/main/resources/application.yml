spring:
  application:
    name: inventory-optimization_service
  datasource:
    name: inventory-optimization_viet-bac_service
    url: ${DATASOURCE_URL}
    username: ${DATASOURCE_USERNAME}
    password: ${DATASOURCE_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: none
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: true
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB
  jackson:
    time-zone: Asia/Ho_Chi_Minh
    date-format: yyyy-MM-dd HH:mm:ss
springdoc:
  api-docs:
    path: /inventory-optimization-service/v3/api-docs
  swagger-ui:
    path: /inventory-optimization-service/swagger/swagger-ui.html
    disable-swagger-default-url: true

external:
  driver-service:
    url: ${DRIVER_SERVICE_URL}
  product-service:
    url: ${PRODUCT_SERVICE_URL}
  warehouse-service:
    url: ${WAREHOUSE_SERVICE_URL}
app:
  inventory:
    # Số điểm dữ liệu tối thiểu để chuyển mô hình
    wma-threshold: 6        # < 6 điểm → WMA
    holt-winters-threshold: 18  # 6-18 điểm → Holt-Winters
    # Tham số Holt-Winters mặc định
    holt-winters:
      alpha: 0.3   # smoothing level
      beta: 0.1    # smoothing trend
      gamma: 0.2   # smoothing seasonal
      season-length: 12  # chu kỳ mùa vụ (12 tháng)
    # Cảnh báo MAPE
    mape-warning-threshold: 20.0  # % MAPE > 20 → cảnh báo
#  security:
#    oauth2:
#      resourceserver:
#        jwt:
#          issuer-uri: ${OAUTH2_ISSUER_URI}
#          jwk-set-uri: ${OAUTH2_JWK_SET_URI}
server:
  port: 8091
