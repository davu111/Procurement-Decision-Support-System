spring:
  application:
    name: inventory-optimization_service
  datasource:
    name: inventory-optimization_viet-bac_service
    url: ${DATASOURCE_URL}
    username: ${DATASOURCE_USERNAME}
    password: ${DATASOURCE_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: none
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: true
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB
  jackson:
    time-zone: Asia/Ho_Chi_Minh
    date-format: yyyy-MM-dd HH:mm:ss
springdoc:
  api-docs:
    path: /inventory-optimization-service/v3/api-docs
  swagger-ui:
    path: /inventory-optimization-service/swagger/swagger-ui.html
    disable-swagger-default-url: true

supplier:
    url: ${SUPPLIER_URL}
server:
  port: 8091
